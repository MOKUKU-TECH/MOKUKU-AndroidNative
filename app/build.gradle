plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mokuku.debug'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mokuku.debug'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'MOKUKU_ACCESS_CODE', groovy.json.JsonOutput.toJson(
                providers.environmentVariable('MOKUKU_ACCESS_CODE').orElse('').get())
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
